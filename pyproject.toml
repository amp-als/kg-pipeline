[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "alskp-kg-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "synapseclient>=4.9.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "pyoxigraph>=0.5.0",
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestration*", "scripts*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.dagster]
module_name = "orchestration.dagster_pipeline.definitions"
